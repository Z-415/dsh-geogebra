name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 濂戠害娴嬭瘯锛氫笉鑱旂綉銆佷笉璧锋祻瑙堝櫒锛屽嚑鍗佺璺戝畬銆?  # 鎸＄殑鏄?瑁呮満鎵嶇煡閬?鐨勯偅绫诲潙锛堣緭鍑?schema 瓒婄晫銆佹敞鍐屾椂鎶涢敊瀵艰嚧宸ュ叿闈欓粯娑堝け銆佹寕杞藉悕鍐欓敊锛夈€?  contract:
    name: 濂戠害娴嬭瘯锛堟棤闇€缃戠粶锛?    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 璇硶妫€鏌?        shell: pwsh
        run: |
          $files = @('index.js') + (Get-ChildItem lib -Filter *.mjs | ForEach-Object { "lib/$($_.Name)" })
          foreach ($f in $files) {
            Write-Host "check $f"
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "璇硶閿欒锛?f" }
          }
      - name: 璺戝绾︽祴璇?        run: node --test test/contract.test.mjs

  # 绔埌绔細鐪熻捣鏃犲ご Edge锛屼粠 geogebra.org 鎷夎祫婧愶紝楠岃瘉鏁板鍒ゆ嵁涓?.ggb銆?  # windows-latest 鑷甫 Microsoft Edge锛屾墍浠ヤ笉鐢ㄩ澶栬娴忚鍣ㄣ€?  e2e:
    name: 绔埌绔紙鐪熸覆鏌擄級
    runs-on: windows-latest
    needs: contract
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 纭 Edge 瀛樺湪
        shell: pwsh
        run: |
          $edge = @(
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw '鎵句笉鍒?msedge.exe锛岀鍒扮鏃犳硶杩涜' }
          Write-Host "Edge: $edge"
      - name: 纭鑳借闂?geogebra.org
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest -Uri 'https://www.geogebra.org/apps/deployggb.js' -Method Head -TimeoutSec 30 -UseBasicParsing
            Write-Host "deployggb.js 鍙闂細$($r.StatusCode)"
          } catch {
            throw "璁块棶 geogebra.org 澶辫触锛堟湰鎻掍欢蹇呴』鑱旂綉鎷?GeoGebra 杩愯璧勬簮锛夛細$($_.Exception.Message)"
          }
      - name: 璺戠鍒扮娴嬭瘯
        run: node --test test/e2e.test.mjs
      - name: 澶辫触鏃剁暀涓嬫棩蹇?        if: failure()
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP 'dsh-geogebra-edge-profile'
          if (Test-Path $tmp) {
            Get-ChildItem $tmp -Force | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          }
          Get-Process msedge -ErrorAction SilentlyContinue | Select-Object Id, StartTime | Format-Table | Out-String | Write-Host
